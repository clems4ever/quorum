version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    misspell:
      locale: US
      ignore-rules:
        - connexion # French UI text

    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
        - name: error-return
        - name: errorf
        - name: blank-imports
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T"
        - name: unused-parameter
        - name: receiver-naming
        - name: increment-decrement
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id

  exclusions:
    rules:
      # Test fixtures build plain cookies to simulate browsers.
      - path: _test\.go
        linters: [gosec]
        text: G124
      # Auth cookies are built by Sessions.cookie: always HttpOnly and
      # SameSite=Lax, and Secure whenever PUBLIC_URL is https (gosec cannot
      # see a configured value).
      - path: internal/auth/(session|handler)\.go
        linters: [gosec]
        text: G124

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - quorum
